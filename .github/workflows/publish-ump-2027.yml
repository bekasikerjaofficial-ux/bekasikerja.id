name: Publish UMP 2027 Estimates

on:
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * *' # 06:30 WIB
    - cron: '30 4 * * *'  # 11:30 WIB
    - cron: '0 9 * * *'   # 16:00 WIB

permissions:
  contents: read

concurrency:
  group: publish-ump-2027
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      UMP_YEAR: '2027'
      UMP_START_DATE: '2026-10-01'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check publisher secrets
        run: |
          set -euo pipefail
          test -n "$NEXT_PUBLIC_SUPABASE_URL" || { echo '::error::SUPABASE_URL belum diset'; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo '::error::SUPABASE_SERVICE_ROLE_KEY belum diset'; exit 1; }
      - run: npm run publish:ump
