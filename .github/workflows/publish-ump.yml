name: Publish UMP 2027 News

on:
  workflow_dispatch:
  schedule:
    # 06:30 WIB = 23:30 UTC (previous UTC day)
    - cron: '30 23 * * *'
    # 11:30 WIB = 04:30 UTC
    - cron: '30 4 * * *'
    # 17:00 WIB = 10:00 UTC
    - cron: '0 10 * * *'

permissions:
  contents: read

concurrency:
  group: publish-ump-2027
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate required secrets
        run: |
          set -euo pipefail
          [ -n "$NEXT_PUBLIC_SUPABASE_URL" ] || { echo '::error::SUPABASE_URL belum diset'; exit 1; }
          [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] || { echo '::error::SUPABASE_SERVICE_ROLE_KEY belum diset'; exit 1; }

      - name: Publish next province article
        run: npm run publish:ump
